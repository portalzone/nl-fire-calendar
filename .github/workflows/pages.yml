# Publishes the app/ folder (and only that folder) to GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions. The repository must be public.
name: Publish app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the app data is present
        run: |
          for f in index.html data/summary.json data/hotspots_clean.csv data/validation.png; do
            test -s "app/$f" || { echo "app/$f is missing. Run the pipeline and commit app/data."; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
